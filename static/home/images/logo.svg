<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <defs>
    <!-- Gradient for subtle shininess -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main H letter with serif font -->
  <text x="20" y="85" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-weight="bold" fill="url(#logoGradient)">H</text>
  
  <!-- Circle with plus sign positioned over upper right serif of H -->
  <g transform="translate(85, 8)">
    <!-- Circle with subtle shadow/depth -->
    <circle cx="18" cy="18" r="17" fill="white" fill-opacity="0.1"/>
    <circle cx="18" cy="18" r="17" fill="#60a5fa"/>
    
    <!-- Plus sign -->
    <g fill="white">
      <!-- Vertical bar of plus -->
      <rect x="15.5" y="10" width="5" height="16" rx="1"/>
      <!-- Horizontal bar of plus -->
      <rect x="10" y="15.5" width="16" height="5" rx="1"/>
    </g>
  </g>
</svg>